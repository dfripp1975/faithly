# Sets up / updates Faithly's Supabase project: database migrations, Bible text,
# Edge Functions and (optional) function secrets. Needs one repository secret:
#   SUPABASETOKEN (or SUPABASE_ACCESS_TOKEN)  (Supabase → Account → Access Tokens)
# Optional secrets passed through to the functions if present:
#   GEMINI_API_KEY, OPENAI_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   STRIPE_PRICE_MONTHLY, STRIPE_PRICE_YEARLY, APP_URL
name: Faithly setup

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Live app address, e.g. https://faithly.vercel.app (sets sign-in redirects)'
        required: false
      admin_email:
        description: 'Email of an existing Faithly account to make an administrator'
        required: false
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/setup-remote.mjs', '.github/workflows/faithly-setup.yml']

concurrency: faithly-setup

env:
  SUPABASE_PROJECT_REF: dxqpffabvwgvpjqlzblu
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASETOKEN }}

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check the access token is configured
        working-directory: .
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a repository secret named SUPABASETOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Check authored content against the Bible text
        run: node scripts/build-seed.mjs --check

      - name: Apply database migrations and load the Bible
        run: node scripts/setup-remote.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3

      - name: Set function secrets (only those provided)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_YEARLY: ${{ secrets.STRIPE_PRICE_YEARLY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          args=()
          for k in GEMINI_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_MONTHLY STRIPE_PRICE_YEARLY APP_URL; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); echo "setting $k"; fi
          done
          if [ -n "$GEMINI_API_KEY" ]; then args+=("AI_PROVIDER=gemini"); elif [ -n "$OPENAI_API_KEY" ]; then args+=("AI_PROVIDER=openai"); fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"; else echo "No optional secrets provided yet."; fi

      - name: Point sign-in emails and redirects at the live app
        if: ${{ inputs.app_url != '' && inputs.app_url != null }}
        env:
          APP_URL_INPUT: ${{ inputs.app_url }}
        run: |
          url="${APP_URL_INPUT%/}"
          body=$(jq -n --arg u "$url" '{site_url: $u, uri_allow_list: ($u + "/**")}')
          code=$(curl -s -o auth.json -w "%{http_code}" -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" != "200" ]; then cat auth.json; echo "::error::Updating auth settings failed ($code)"; exit 1; fi
          jq '{site_url, uri_allow_list}' auth.json
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "APP_URL=$url"

      - name: Make an administrator
        if: ${{ inputs.admin_email != '' && inputs.admin_email != null }}
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          if ! [[ "$ADMIN_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then echo "::error::That doesn't look like an email address."; exit 1; fi
          sql=$(jq -n --arg e "$ADMIN_EMAIL" '{query: ("update public.profiles set is_admin = true where id = (select id from auth.users where lower(email) = lower(\u0027" + $e + "\u0027)) returning id")}')
          res=$(curl -s -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$sql")
          echo "$res"
          if [ "$(echo "$res" | jq 'length')" != "1" ]; then echo "::error::No account found for that email. Sign up in the app first."; exit 1; fi
          echo "Administrator added."

      - name: Deploy Edge Functions
        # Every function checks the caller itself (signed-in user, Stripe signature or cron secret),
        # so gateway JWT verification is off; this also works with Supabase's newer API keys.
        run: |
          for fn in faithly-ai create-checkout customer-portal delete-account admin-stats stripe-webhook send-reminders; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          done

      - name: Smoke test
        run: |
          base="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1"
          code=$(curl -s -o out.json -w "%{http_code}" -X POST "$base/faithly-ai" -H "Content-Type: application/json" -d '{"mode":"chat","message":"hi"}')
          cat out.json; echo
          if [ "$code" != "401" ]; then echo "::error::faithly-ai should answer 401 to a signed-out request, got $code"; exit 1; fi
          echo "Functions are live."
